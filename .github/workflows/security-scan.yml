name: security-scan

# Nightly Trivy scan of every catalog image, straight from the published GHCR digests
# (the image packages are public). Writes src/data/security.json — the authoritative,
# ArtifactHub-independent source of the catalog's CVE numbers and per-image grades.
# Pushing the refreshed file triggers the normal site redeploy.
on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: security-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26 # matches package.json engines (>=26)

      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          trivy --version

      # Authenticate pulls to GHCR so the parallel scans aren't anonymous-rate-limited.
      - name: Log in to GHCR for image pulls
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Warm the Trivy vuln DB (once, before parallel scans)
        run: trivy image --download-db-only

      # The build gate applies each app's VEX; this scan did not, so the public feed
      # reported findings the project has already shown do not apply. kgateway is the
      # standing case: five istio advisories from 2019-2022 against a 2026 commit,
      # because istio tags releases without a `v`, Go must therefore use a
      # v0.0.0-<date>-<sha> pseudo-version, and Trivy sorts that below every fixed
      # version. Pulling the files keeps the feed and the gate telling the same story.
      - name: Fetch VEX files from the images repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/vex"
          gh api repos/quenchworks/images/contents/apps --jq '.[].name' > /tmp/apps.txt
          n=0
          while read -r app; do
            if gh api "repos/quenchworks/images/contents/apps/${app}/vex.openvex.json" \
                 --jq '.content' 2>/dev/null | base64 -d > "${RUNNER_TEMP}/vex/${app}.openvex.json"; then
              [ -s "${RUNNER_TEMP}/vex/${app}.openvex.json" ] && { n=$((n+1)); echo "vex: ${app}"; } \
                || rm -f "${RUNNER_TEMP}/vex/${app}.openvex.json"
            else
              rm -f "${RUNNER_TEMP}/vex/${app}.openvex.json"
            fi
          done < /tmp/apps.txt
          echo "fetched ${n} VEX file(s)"
          # An empty dir is fine: scan-images.mjs adds --vex only when a file exists.

      - name: Scan all catalog images
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          VEX_DIR: ${{ runner.temp }}/vex
        run: node scripts/scan-images.mjs

      # Worst offenders straight into the run summary, so the nightly result is
      # readable without opening the diff.
      - name: Summarize the worst offenders
        if: always()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("src/data/security.json", "utf8"));
            const rows = Object.entries(r)
              .map(([slug, v]) => ({ slug, version: v.version, total: v.total || 0, fixable: v.fixable || 0, grade: v.grade }))
              .filter((x) => x.total > 0)
              .sort((a, b) => b.fixable - a.fixable || b.total - a.total)
              .slice(0, 15);
            const all = Object.values(r);
            const out = [
              "## Nightly Trivy scan",
              "",
              `${all.length} images scanned · ${all.reduce((a, v) => a + (v.total || 0), 0)} worst-case CVEs · ${all.filter((v) => (v.fixable || 0) > 0).length} need a rebuild`,
              "",
              ...(rows.length ? [
                "| image | version | total | fixable | grade |",
                "| --- | --- | --: | --: | --- |",
                ...rows.map((x) => `| ${x.slug} | ${x.version} | ${x.total} | ${x.fixable} | ${x.grade} |`),
              ] : ["No CVEs anywhere in the catalog."]),
              "",
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          '

      - name: Commit security.json if it changed
        run: |
          set -euo pipefail
          if git diff --quiet src/data/security.json; then
            echo "security.json unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "QuenchWorks"
          git config user.email "info@quench-works.com"
          git add src/data/security.json
          git commit -m "chore(security): nightly Trivy scan of all catalog images" \
                     -m "Per-version severity counts, grade/score, and the deduped per-CVE detail (id, severity, package, installed/fixed version, title, advisory URL, affected targets) the detail pages and the /api/v1/security endpoints serve." \
                     -m "Co-Authored-By: QuenchWorks <info@quench-works.com>"
          git push
